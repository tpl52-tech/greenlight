<title>Cue QA Runs</title>
<style>
  /* Layout: a fixed-height QA workspace — ticket queue (left) + run sheet (right),
     master→detail on mobile. apple.com restraint: SF type, hairlines, one blue accent,
     semantic pass/fail/blocked color kept separate from the accent. */
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #ececef;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --faint: #a1a1a6;
    --separator: rgba(0,0,0,0.09);
    --hairline: rgba(0,0,0,0.06);
    --accent: #0071e3;
    --accent-2: #30a3ff;
    --nav: rgba(245,245,247,0.78);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 34px -18px rgba(0,0,0,0.2);
    --ring: rgba(0,113,227,0.4);
    --good: #34c759; --bad: #ff3b30; --warn: #ff9f0a;
    --good-bg: rgba(52,199,89,0.12); --bad-bg: rgba(255,59,48,0.10); --warn-bg: rgba(255,149,0,0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #161618; --surface-2: #26262a;
      --fg: #f5f5f7; --muted: #a1a1a6; --faint: #68686d;
      --separator: rgba(255,255,255,0.13); --hairline: rgba(255,255,255,0.08);
      --accent: #2997ff; --accent-2: #5ab0ff; --nav: rgba(0,0,0,0.6);
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 14px 40px -18px rgba(0,0,0,0.7);
      --ring: rgba(41,151,255,0.5);
      --good: #30d158; --bad: #ff453a; --warn: #ff9f0a;
      --good-bg: rgba(48,209,88,0.16); --bad-bg: rgba(255,69,58,0.15); --warn-bg: rgba(255,159,10,0.16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #161618; --surface-2: #26262a;
    --fg: #f5f5f7; --muted: #a1a1a6; --faint: #68686d;
    --separator: rgba(255,255,255,0.13); --hairline: rgba(255,255,255,0.08);
    --accent: #2997ff; --accent-2: #5ab0ff; --nav: rgba(0,0,0,0.6);
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 14px 40px -18px rgba(0,0,0,0.7);
    --ring: rgba(41,151,255,0.5);
    --good: #30d158; --bad: #ff453a; --warn: #ff9f0a;
    --good-bg: rgba(48,209,88,0.16); --bad-bg: rgba(255,69,58,0.15); --warn-bg: rgba(255,159,10,0.16);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.45; color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  svg { display: block; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: var(--accent); color: #fff; }

  .app { height: 100%; display: flex; flex-direction: column; }

  /* ---- nav ---- */
  .nav {
    flex: none; height: 52px; display: flex; align-items: center; gap: 14px;
    padding: 0 clamp(14px, 3vw, 22px);
    background: var(--nav);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separator);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600;
    font-size: 18px; letter-spacing: -0.02em; }
  .brand .mark { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #fff; }
  .brand .mark svg { width: 13px; height: 13px; }
  .brand .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
    border: 1px solid var(--separator); border-radius: 5px; padding: 2px 5px; margin-left: 2px; }
  .nav-spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 7px; background: var(--surface-2); color: var(--muted);
    border-radius: 8px; padding: 6px 11px; width: 230px;
  }
  .search svg { width: 15px; height: 15px; flex: none; }
  .search input { border: none; background: none; outline: none; color: var(--fg); width: 100%; font-size: 14px; }
  .search input::placeholder { color: var(--muted); }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: transparent; color: var(--muted); display: grid; place-items: center;
    transition: background 0.15s, color 0.15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .icon-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .icon-btn svg { width: 19px; height: 19px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(145deg, #c7c7cc, #8e8e93); color: #fff; font-size: 12px; font-weight: 600; }

  /* ---- workspace ---- */
  .workspace { flex: 1; min-height: 0; display: flex; }
  .queue { width: 364px; flex: none; min-height: 0; display: flex; flex-direction: column;
    border-right: 0.5px solid var(--separator); background: var(--bg); }
  .sheet { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }

  /* ---- queue ---- */
  .q-head { flex: none; padding: 14px 16px 10px; }
  .q-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .q-title .live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
  .refresh-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; color: var(--muted);
    cursor: pointer; display: grid; place-items: center; transition: background 0.15s, color 0.15s; }
  .refresh-btn:hover { background: var(--surface-2); color: var(--fg); }
  .refresh-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .refresh-btn svg { width: 17px; height: 17px; }
  .refresh-btn.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .q-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .q-status { font-size: 12px; margin-top: 6px; color: var(--muted); min-height: 15px; }
  .q-status.err { color: var(--warn); }
  .qfilter { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .fchip { border: none; cursor: pointer; border-radius: 980px; padding: 5px 11px; font-size: 13px;
    font-weight: 500; background: var(--surface-2); color: var(--fg); display: inline-flex; gap: 6px; align-items: center; }
  .fchip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .fchip[aria-current="true"] { background: var(--fg); color: var(--bg); }
  .fchip[aria-current="true"] .n { color: var(--bg); opacity: 0.7; }
  .q-list { flex: 1; overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .q-card { text-align: left; width: 100%; cursor: pointer; border: 0.5px solid var(--separator);
    background: var(--surface); border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.15s, transform 0.08s; box-shadow: var(--shadow); }
  .q-card:hover { border-color: var(--faint); }
  .q-card:active { transform: scale(0.994); }
  .q-card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .q-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-id { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
  .q-id .pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .q-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .q-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-steps { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .who .ava { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 10px; font-weight: 600; }

  .pill { font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; padding: 3px 9px; border-radius: 980px;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.todo { color: var(--muted); background: var(--surface-2); }
  .pill.prog { color: var(--accent); background: rgba(0,113,227,0.12); }
  .pill.pass { color: var(--good); background: var(--good-bg); }
  .pill.fail { color: var(--bad); background: var(--bad-bg); }
  .pill.blocked { color: var(--warn); background: var(--warn-bg); }

  /* ---- sheet ---- */
  .sheet-scroll { flex: 1; overflow-y: auto; }
  .sheet-inner { max-width: 760px; margin: 0 auto; padding: clamp(18px, 3vw, 30px) clamp(18px, 4vw, 34px) 24px; }
  .back { display: none; align-items: center; gap: 4px; background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 15px; padding: 2px 0; margin-bottom: 10px; }
  .back svg { width: 18px; height: 18px; }

  .sh-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .sh-eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sh-title { font-size: clamp(26px, 4.4vw, 34px); font-weight: 700; letter-spacing: -0.025em;
    line-height: 1.08; margin: 10px 0 0; text-wrap: balance; }
  .sh-meta { display: flex; align-items: center; gap: 10px 14px; margin-top: 13px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .sh-meta .who .ava { width: 22px; height: 22px; font-size: 11px; }
  .sh-meta .wl { color: var(--faint); margin-right: 4px; }
  .sh-link { color: var(--accent); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .sh-link:hover { text-decoration: underline; }
  .ltag { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2);
    border-radius: 6px; padding: 3px 8px; letter-spacing: 0.01em; }
  .prio { display: inline-flex; align-items: center; gap: 5px; color: var(--warn); font-weight: 600; }
  .prio svg { width: 14px; height: 14px; }

  .ring-wrap { flex: none; position: relative; width: 92px; height: 92px; }
  .ring-wrap svg { width: 92px; height: 92px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--surface-2); stroke-width: 9; }
  .ring-bar { fill: none; stroke: url(#grad); stroke-width: 9; stroke-linecap: round;
    transition: stroke-dashoffset 0.5s cubic-bezier(0.22,1,0.36,1); }
  .ring-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .ring-pct { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ring-cap { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

  .lead { margin-top: 20px; }
  .lead-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin-bottom: 6px; }
  .lead p { margin: 0; font-size: 16px; letter-spacing: -0.01em; color: var(--fg); }

  .section-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 26px 0 10px; }

  .card { background: var(--surface); border: 0.5px solid var(--separator); border-radius: 16px;
    box-shadow: var(--shadow); }
  .pre-list { padding: 4px 6px; }
  .pre-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 10px; cursor: pointer;
    border-bottom: 0.5px solid var(--hairline); width: 100%; text-align: left; background: none;
    border-left: none; border-right: none; border-top: none; }
  .pre-list .pre-row:last-child { border-bottom: none; }
  .pre-check { flex: none; width: 21px; height: 21px; margin-top: 1px; border-radius: 6px;
    border: 1.7px solid var(--faint); background: transparent; display: grid; place-items: center;
    color: #fff; transition: background 0.15s, border-color 0.15s; }
  .pre-check svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.15s; }
  .pre-row.on .pre-check { background: var(--accent); border-color: var(--accent); }
  .pre-row.on .pre-check svg { opacity: 1; }
  .pre-text { flex: 1; min-width: 0; font-size: 14.5px; }
  .pre-row.on .pre-text { color: var(--muted); }

  .note-card { display: flex; gap: 11px; align-items: flex-start; padding: 13px 15px; margin-top: 10px;
    background: var(--warn-bg); border-radius: 14px; }
  .note-card .ic { flex: none; color: var(--warn); margin-top: 1px; }
  .note-card .ic svg { width: 18px; height: 18px; }
  .note-card .nt-label { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--warn); margin-bottom: 2px; }
  .note-card .nt-body { font-size: 14px; color: var(--fg); min-width: 0; }

  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step { background: var(--surface); border: 0.5px solid var(--separator); border-radius: 16px;
    box-shadow: var(--shadow); padding: 16px 16px 14px; }
  .step-top { display: flex; gap: 12px; align-items: flex-start; }
  .step-n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface-2); color: var(--fg); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    transition: background 0.15s, color 0.15s; }
  .step.pass .step-n { background: var(--good); color: #fff; }
  .step.fail .step-n { background: var(--bad); color: #fff; }
  .step-h { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.012em; padding-top: 2px; }
  .do { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .do li { position: relative; padding-left: 20px; font-size: 14.5px; color: var(--fg); }
  .do li::before { content: ""; position: absolute; left: 6px; top: 9px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--faint); }
  .crit { display: flex; gap: 9px; align-items: flex-start; padding: 9px 12px; border-radius: 11px; margin-top: 10px; font-size: 14px; }
  .crit .ic { flex: none; margin-top: 1px; }
  .crit .ic svg { width: 16px; height: 16px; }
  .crit.expect { background: var(--good-bg); }
  .crit.expect .ic { color: var(--good); }
  .crit.failif { background: var(--bad-bg); }
  .crit.failif .ic { color: var(--bad); }
  .crit .lbl { font-weight: 700; }
  .crit.expect .lbl { color: var(--good); }
  .crit.failif .lbl { color: var(--bad); }

  .step-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .res-btn { border: 1px solid var(--separator); background: var(--surface); color: var(--muted); cursor: pointer;
    border-radius: 980px; padding: 7px 15px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.14s; }
  .res-btn svg { width: 15px; height: 15px; }
  .res-btn:hover { border-color: var(--faint); }
  .res-btn.pass.on { background: var(--good); border-color: var(--good); color: #fff; }
  .res-btn.fail.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .res-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .res-btn:disabled, .v-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pre-row:disabled { cursor: default; }
  .pre-row:disabled .pre-check { opacity: 0.5; }
  .step-note { margin-top: 11px; width: 100%; border: 0.5px solid var(--separator); background: var(--bg);
    border-radius: 11px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--fg); outline: none; resize: vertical;
    min-height: 44px; }
  .step-note:focus { border-color: var(--accent); }
  .step-note::placeholder { color: var(--faint); }

  /* ---- verdict bar ---- */
  .verdict-bar { flex: none; border-top: 0.5px solid var(--separator); background: var(--nav);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    padding: 12px clamp(16px, 4vw, 34px); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .verdict-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .tally { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
  .tally b { color: var(--fg); font-weight: 600; }
  .verdict-spacer { flex: 1; }
  .verdict-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .v-btn { border: 1px solid var(--separator); background: var(--surface); cursor: pointer; color: var(--fg);
    border-radius: 980px; padding: 8px 16px; font-size: 14px; font-weight: 600; transition: all 0.14s; }
  .v-btn:hover { border-color: var(--faint); }
  .v-btn.pass.on { background: var(--good); border-color: var(--good); color: #fff; }
  .v-btn.fail.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .v-btn.blocked.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .v-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .empty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 20px; }

  @media (max-width: 900px) {
    .queue { width: 100%; }
    .search { display: none; }
    .workspace[data-view="list"] .sheet { display: none; }
    .workspace[data-view="detail"] .queue { display: none; }
    .back { display: inline-flex; }
    .verdict-inner { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, .refresh-btn.spin svg { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="nav">
    <span class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg></span>
      Cue <span class="tag">QA</span>
    </span>
    <span class="nav-spacer"></span>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search tickets" aria-label="Search tickets" autocomplete="off">
    </label>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle appearance" title="Toggle appearance"></button>
    <span class="avatar" aria-hidden="true">TL</span>
  </header>

  <div class="workspace" id="workspace" data-view="list">
    <aside class="queue" aria-label="Ticket queue">
      <div class="q-head">
        <div class="q-title-row">
          <div class="q-title"><span class="live" aria-hidden="true"></span>Verifying</div>
          <button class="refresh-btn" id="refreshBtn" title="Refresh from Linear" aria-label="Refresh tickets from Linear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.2V8h-4.8"/></svg>
          </button>
        </div>
        <div class="q-sub" id="qSub"></div>
        <div class="q-status" id="qStatus"></div>
        <div class="qfilter" id="qfilter"></div>
      </div>
      <div class="q-list" id="qList"></div>
    </aside>

    <section class="sheet" aria-label="Run sheet">
      <div class="sheet-scroll"><div class="sheet-inner" id="sheetInner"></div></div>
      <div class="verdict-bar" id="verdictBar" hidden>
        <div class="verdict-inner" id="verdictInner"></div>
      </div>
    </section>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/>
  </linearGradient>
</defs></svg>

<script>
  const S = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const ICON = {
    check: S('<path d="M5 12.5l4 4 10-10.5"/>'),
    x: S('<path d="M6 6l12 12M18 6L6 18"/>'),
    flag: S('<path d="M5 21V4M5 4.5h11l-2.2 4 2.2 4H5"/>'),

    const anyStep = r.steps && Object.values(r.steps).some(Boolean);
    const anyPre = r.pre && Object.values(r.pre).some(Boolean);
    return (anyStep || anyPre) ? { k:'prog', label:'In Progress' } : { k:'todo', label:'To Do' };
  }
  function inFilter(id, f) {
    const s = statusOf(id).k;
    if (f === 'all') return true;
    if (f === 'done') return s === 'pass' || s === 'fail' || s === 'blocked';
    return s === f;
  }
  function matchSearch(t) {
    if (!searchQ) return true;
    return (t.id + ' ' + t.title + ' ' + t.comp + ' ' + t.assignee).toLowerCase().includes(searchQ);
  }
  function checkedCount(t) { const r = readRun(t.id); return t.steps.filter(s => r.steps[s.n]).length; }
  const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // ---------- render ----------
  function renderStatus() {
    const b = document.getElementById('refreshBtn');
    b.classList.toggle('spin', refreshing);
    const el = document.getElementById('qStatus');
    el.className = 'q-status';
    if (refreshing) { el.textContent = 'Refreshing from Linear…'; return; }
    if (refreshError) { el.textContent = errText(refreshError); el.className = 'q-status err'; return; }
    if (lastRefreshed) { el.textContent = 'Updated from Linear ' + timeAgo(lastRefreshed); return; }
    if (mcpCap === null) { el.textContent = 'Connect Linear to refresh'; return; }
    el.textContent = 'Baked snapshot · tap ↻ to sync with Linear';
  }
  function renderFilters() {
    document.getElementById('qfilter').innerHTML = FILTERS.map(f => {
      const n = tickets.filter(t => inFilter(t.id, f.id)).length;
      return `<button class="fchip" data-filter="${f.id}" aria-current="${queueFilter === f.id}">${f.name}<span class="n">${n}</span></button>`;
    }).join('');
  }
  function renderQueue() {
    renderFilters();
    const list = tickets.filter(t => inFilter(t.id, queueFilter) && matchSearch(t));
    const el = document.getElementById('qList');
    const verified = tickets.filter(t => ['pass','fail','blocked'].includes(statusOf(t.id).k)).length;
    document.getElementById('qSub').textContent =
      `ReUse App — Fall 2026 · ${tickets.length} to verify · ${verified} done`;
    renderStatus();
    if (!list.length) { el.innerHTML = `<div style="color:var(--muted);font-size:14px;padding:24px 8px;text-align:center">No tickets match.</div>`; return; }
    el.innerHTML = list.map(t => {
      const st = statusOf(t.id);
      const done = checkedCount(t), total = t.steps.length;
      const prio = t.priority === 'high' ? '<span class="pdot" title="High priority"></span>' : '';
      return `<button class="q-card" data-id="${escapeHtml(t.id)}" aria-current="${current === t.id}">
        <div class="q-top">
          <span class="q-id">${prio}${escapeHtml(t.id)}</span>
          <span class="pill ${st.k}">${st.label}</span>
        </div>
        <div class="q-name">${escapeHtml(t.title)}</div>
        <div class="q-bottom">
          <span class="q-steps">${done}/${total} steps</span>
          <span class="who">${avaHTML(t.assignee)} ${escapeHtml((t.assignee || '').split(' ')[0])}</span>
        </div>
      </button>`;
    }).join('');
  }

  const C = 2 * Math.PI * 40;
  function renderSheet() {
    const t = ticketById(current);
    const inner = document.getElementById('sheetInner');
    const bar = document.getElementById('verdictBar');
    if (!t) { inner.innerHTML = `<div class="empty">Select a ticket to begin.</div>`; bar.hidden = true; return; }
    const r = readRun(t.id);
    const done = checkedCount(t), total = t.steps.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const ro = readOnly();
    const url = /^https:\/\//.test(t.url || '') ? t.url : '#';

    const pre = t.pre.map((p, i) => `
      <button class="pre-row ${r.pre[i] ? 'on' : ''}" data-pre="${i}"${ro ? ' disabled' : ''}>
        <span class="pre-check">${ICON.check}</span>
        <span class="pre-text">${escapeHtml(p)}</span>
      </button>`).join('');

    const headsup = t.headsup ? `
      <div class="note-card">
        <span class="ic">${ICON.info}</span>
        <div><div class="nt-label">Heads up</div><div class="nt-body">${escapeHtml(t.headsup)}</div></div>
      </div>` : '';

    const steps = t.steps.map(s => {
      const res = r.steps[s.n];
      const doList = (s.do || []).map(d => `<li>${escapeHtml(d)}</li>`).join('');
      const expect = `<div class="crit expect"><span class="ic">${ICON.check}</span><div><span class="lbl">Expect —</span> ${escapeHtml(s.expect)}</div></div>`;
      const failif = s.failif ? `<div class="crit failif"><span class="ic">${ICON.x}</span><div><span class="lbl">Fail if —</span> ${escapeHtml(s.failif)}</div></div>` : '';
      const note = res === 'fail'
        ? `<textarea class="step-note" data-note="${s.n}"${ro ? ' readonly' : ''} placeholder="What went wrong? (note for the lead)">${escapeHtml(r.notes[s.n] || '')}</textarea>` : '';
      return `<div class="step ${res || ''}">
        <div class="step-top">
          <span class="step-n">${s.n}</span>
          <div class="step-h">${escapeHtml(s.title)}</div>
        </div>
        ${doList ? `<ul class="do">${doList}</ul>` : ''}
        ${expect}${failif}
        <div class="step-actions">
          <button class="res-btn pass ${res === 'pass' ? 'on' : ''}" data-step="${s.n}" data-res="pass"${ro ? ' disabled' : ''}>${ICON.check} Pass</button>
          <button class="res-btn fail ${res === 'fail' ? 'on' : ''}" data-step="${s.n}" data-res="fail"${ro ? ' disabled' : ''}>${ICON.x} Fail</button>
        </div>
        ${note}
      </div>`;
    }).join('');

    inner.innerHTML = `
      <button class="back" id="backBtn">${ICON.back} Queue</button>
      <div class="sh-head">
        <div style="min-width:0">
          <div class="sh-eyebrow">${escapeHtml(t.id)} · ${escapeHtml(t.comp)}</div>
          <h1 class="sh-title">${escapeHtml(t.title)}</h1>
          <div class="sh-meta">
            <span class="who"><span class="wl">Built by</span> ${avaHTML(t.assignee)} ${escapeHtml(t.assignee)}</span>
            ${t.priority === 'high' ? `<span class="prio">${ICON.flag} High</span>` : ''}
            ${t.milestone ? `<span>${escapeHtml(t.milestone)}</span>` : ''}
            ${(t.labels || []).map(l => `<span class="ltag">${escapeHtml(l)}</span>`).join('')}
            <a class="sh-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">View in Linear ↗</a>
          </div>
        </div>
        <div class="ring-wrap" role="img" aria-label="${done} of ${total} steps checked">
          <svg viewBox="0 0 92 92">
            <circle class="ring-track" cx="46" cy="46" r="40"/>
            <circle class="ring-bar" cx="46" cy="46" r="40" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - pct / 100)}"/>
          </svg>
          <div class="ring-label"><div class="ring-pct">${done}/${total}</div><div class="ring-cap">Checked</div></div>
        </div>
      </div>

      <div class="lead"><div class="lead-label">What “working” means</div><p>${escapeHtml(t.summary)}</p></div>

      <div class="section-h">Before you start</div>
      <div class="card pre-list">${pre}</div>
      ${headsup}

      <div class="section-h">Steps</div>
      <div class="steps">${steps}</div>
    `;

    const pass = t.steps.filter(s => r.steps[s.n] === 'pass').length;
    const fail = t.steps.filter(s => r.steps[s.n] === 'fail').length;
    const roNote = ro ? ' · view-only — ask the lead for edit access to record' : '';
    bar.hidden = false;
    document.getElementById('verdictInner').innerHTML = `
      <div class="tally"><b>${pass}</b> pass · <b>${fail}</b> fail · ${done}/${total} checked${roNote}</div>
      <span class="verdict-spacer"></span>
      <span class="verdict-label">Record result:</span>
      <button class="v-btn pass ${r.verdict === 'pass' ? 'on' : ''}" data-verdict="pass"${ro ? ' disabled' : ''}>Pass</button>
      <button class="v-btn fail ${r.verdict === 'fail' ? 'on' : ''}" data-verdict="fail"${ro ? ' disabled' : ''}>Fail</button>
      <button class="v-btn blocked ${r.verdict === 'blocked' ? 'on' : ''}" data-verdict="blocked"${ro ? ' disabled' : ''}>Blocked</button>
    `;
  }

  function renderAll() { renderQueue(); renderSheet(); updateThemeBtn(); }

  // ---------- interactions ----------
  function selectTicket(id) {
    current = id;
    document.getElementById('workspace').setAttribute('data-view', 'detail');
    renderQueue(); renderSheet();
    const sc = document.querySelector('.sheet-scroll'); if (sc) sc.scrollTop = 0;
  }

  document.body.addEventListener('click', e => {
    if (e.target.closest('#refreshBtn')) { refreshTickets(); return; }
    const qc = e.target.closest('.q-card');
    if (qc) { selectTicket(qc.getAttribute('data-id')); return; }
    const fc = e.target.closest('.fchip');
    if (fc) { queueFilter = fc.getAttribute('data-filter'); renderQueue(); return; }
    if (e.target.closest('#backBtn')) { document.getElementById('workspace').setAttribute('data-view', 'list'); return; }

    if (readOnly()) return; // controls render disabled; this guards the data-editing branches only
    const pre = e.target.closest('.pre-row');
    if (pre) { const i = pre.getAttribute('data-pre'); edit(current, 'pre.' + i, !readRun(current).pre[i]); return; }
    const rb = e.target.closest('.res-btn');
    if (rb) { const n = rb.getAttribute('data-step'), v = rb.getAttribute('data-res'); edit(current, 'steps.' + n, readRun(current).steps[n] === v ? null : v); return; }
    const vb = e.target.closest('.v-btn');
    if (vb) { const v = vb.getAttribute('data-verdict'); edit(current, 'verdict', readRun(current).verdict === v ? null : v); return; }
  });

  let noteTimer = null;
  document.body.addEventListener('input', e => {
    const nt = e.target.closest('.step-note');
    if (nt) { // overlay the note locally without a re-render (keeps focus/caret), persist debounced
      if (readOnly()) return;
      const id = current, n = nt.getAttribute('data-note'), val = nt.value;
      (pending[id] = pending[id] || {})['notes.' + n] = val; rebuildRuns();
      clearTimeout(noteTimer); noteTimer = setTimeout(() => { if (db && dbWritable) persistField(id, 'notes.' + n, val); else saveLocalRuns(); }, 500);
    }
  });

  document.getElementById('search').addEventListener('input', e => { searchQ = e.target.value.trim().toLowerCase(); renderQueue(); });

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function updateThemeBtn() { document.getElementById('themeBtn').innerHTML = currentTheme() === 'dark' ? ICON.sun : ICON.moon; }
  document.getElementById('themeBtn').addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('cueqa-theme', next); } catch (e) {}
    updateThemeBtn();
  });

  // ---------- boot ----------
  try { const th = localStorage.getItem('cueqa-theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  renderAll();
  initDb();
  initUser();
  getCap('mcp').then(c => { mcpCap = c; renderStatus(); });
</script>
